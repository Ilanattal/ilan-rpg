<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ILAN — Life RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--teal-400:#1D9E75;--teal-200:#5DCAA5;--teal-600:#0F6E56;--teal-900:#04342C;--coral-400:#D85A30;--amber-200:#EF9F27;--amber-400:#BA7517;--purple-400:#7F77DD;--purple-600:#534AB7;--red-400:#E24B4A;--bg:#04342C;--bg2:#062f25;--bg3:#094035;--bd:rgba(29,158,117,0.15);--bd2:rgba(29,158,117,0.3);--tx:#E1F5EE;--tx2:#5DCAA5;--tx3:#1D9E75;--gold:#EF9F27;--gold2:#BA7517;--xp:#5DCAA5;--xp2:#1D9E75;--green:#5DCAA5;--red:#D85A30;--purple:#7F77DD;--orange:#EF9F27;--ca:#D85A30;--cb:#5DCAA5;--cc:#EF9F27;--cd:#7F77DD;--ce:#D85A30;--cf:#1D9E75;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:Syne,sans-serif;min-height:100vh;}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;min-height:100vh;}
.topbar{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:100;}
.logo{font-size:17px;font-weight:800;letter-spacing:.1em;color:var(--gold);}
.logo span{color:var(--tx2);font-weight:400;font-size:12px;margin-left:6px;letter-spacing:0;}
.tstats{display:flex;gap:16px;margin-left:auto;align-items:center;}
.tstat{font-size:12px;color:var(--tx2);}
.tstat b{font-family:'DM Mono',monospace;font-size:14px;font-weight:700;}
.lvbadge{background:linear-gradient(135deg,var(--xp2),var(--purple));padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.sidebar{background:var(--bg2);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
.nsec{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--tx3);text-transform:uppercase;padding:10px 8px 4px;}
.ni{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--tx2);transition:all .15s;border:1px solid transparent;}
.ni:hover,.ni.active{background:var(--bg3);color:var(--tx);}
.ni.active{border-color:var(--bd2);}
.ndot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.nc{margin-left:auto;background:var(--bg);border-radius:20px;padding:1px 6px;font-size:10px;color:var(--tx3);}
.main{overflow-y:auto;padding:24px;}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;}
.csm{background:var(--bg3);border:1px solid var(--bd);border-radius:12px;padding:12px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.ptitle{font-size:20px;font-weight:800;margin-bottom:3px;}
.psub{font-size:12px;color:var(--tx2);margin-bottom:20px;}
.stitle{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin:18px 0 10px;}
.stitle:first-child{margin-top:0;}
.snum{font-size:20px;font-weight:800;}
.slbl{font-size:11px;color:var(--tx2);margin-top:2px;}
.xbar{background:var(--bg3);border-radius:20px;height:6px;overflow:hidden;margin-top:5px;}
.xfill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--xp2),var(--xp));transition:width .6s;}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500;}
.te{background:rgba(61,204,122,.12);color:var(--green);}
.tm{background:rgba(255,140,66,.12);color:var(--orange);}
.th{background:rgba(255,85,85,.12);color:var(--red);}
.tp{background:rgba(155,109,255,.12);color:var(--purple);}
.tx{background:rgba(74,158,255,.1);color:var(--xp);}
.tg{background:rgba(245,200,66,.1);color:var(--gold);}
.tt{background:rgba(255,255,255,.05);color:var(--tx3);font-size:10px;}
.sbadge{display:inline-flex;align-items:center;gap:3px;background:rgba(255,140,66,.12);color:var(--orange);border-radius:20px;padding:2px 7px;font-size:11px;font-weight:600;}
.tc{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px;display:flex;align-items:flex-start;gap:12px;position:relative;overflow:hidden;margin-bottom:8px;transition:border .15s;}
.tc:hover{border-color:var(--bd2);}
.tc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;}
.tc.ca::before{background:var(--red);}
.tc.cb::before{background:var(--xp);}
.tc.cc::before{background:var(--gold);}
.tc.cd::before{background:var(--purple);}
.tc.ce::before{background:var(--red);}
.tc.cf::before{background:var(--green);}
.tck{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--bd2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;}
.tck.done{background:var(--green);border-color:var(--green);}
.ti{flex:1;}
.tn{font-size:13px;font-weight:600;margin-bottom:3px;line-height:1.3;}
.tn.s{text-decoration:line-through;color:var(--tx2);}
.tw{font-size:11px;color:var(--tx2);margin-bottom:6px;font-style:italic;}
.tm2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:Syne,sans-serif;transition:all .15s;}
.bp{background:var(--xp);color:#fff;}.bp:hover{background:var(--xp2);}
.bg{background:var(--gold);color:#111;}.bg:hover{background:var(--gold2);}
.bgh{background:transparent;color:var(--tx2);border:1px solid var(--bd2);}.bgh:hover{background:var(--bg3);color:var(--tx);}
.br{background:rgba(255,85,85,.15);color:var(--red);border:1px solid rgba(255,85,85,.2);}
.bsm{padding:4px 9px;font-size:11px;border-radius:7px;}
.bfw{width:100%;justify-content:center;}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.mo.h{display:none;}
.mb{background:var(--bg2);border:1px solid var(--bd2);border-radius:18px;padding:24px;max-width:460px;width:100%;}
.mt{font-size:17px;font-weight:800;margin-bottom:6px;}
.ms{font-size:13px;color:var(--tx2);margin-bottom:18px;line-height:1.5;}
.mbtns{display:flex;gap:8px;}
.mopt{background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:12px;cursor:pointer;transition:all .15s;margin-bottom:8px;}
.mopt:hover{border-color:var(--xp2);}
.moptn{font-size:13px;font-weight:600;margin-bottom:4px;}
.shopg{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
.si{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:center;position:relative;transition:all .2s;cursor:pointer;}
.si:hover:not(.lk){border-color:var(--gold2);transform:translateY(-2px);}
.si.lk{opacity:.45;cursor:default;}
.sico{font-size:26px;margin-bottom:8px;}
.snm{font-size:12px;font-weight:700;margin-bottom:3px;}
.spr{font-size:17px;font-weight:800;color:var(--gold);margin-bottom:3px;}
.ssh{font-size:11px;color:var(--tx2);}
.stm{font-size:10px;color:var(--tx3);margin-top:3px;font-style:italic;}
.fb{position:absolute;top:8px;right:8px;font-size:9px;padding:2px 5px;border-radius:20px;font-weight:600;}
.fb.fr{background:rgba(61,204,122,.12);color:var(--green);}
.fb.fl{background:rgba(255,85,85,.12);color:var(--red);}
.cw{display:flex;flex-direction:column;height:calc(100vh - 160px);}
.cms{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;}
.msg{display:flex;gap:8px;max-width:85%;}
.msg.u{margin-left:auto;flex-direction:row-reverse;}
.mav{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.mav.c{background:linear-gradient(135deg,var(--xp2),var(--purple));color:#fff;}
.mav.u{background:var(--gold);color:#111;}
.mbbl{padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.6;}
.msg.coach .mbbl{background:var(--bg3);border:1px solid var(--bd);border-top-left-radius:3px;}
.msg.u .mbbl{background:var(--xp2);color:#fff;border-top-right-radius:3px;}
.ciw{padding:12px;border-top:1px solid var(--bd);display:flex;gap:8px;}
.ci{flex:1;background:var(--bg3);border:1px solid var(--bd2);border-radius:10px;padding:9px 12px;color:var(--tx);font-family:Syne,sans-serif;font-size:13px;resize:none;height:42px;outline:none;}
.ci:focus{border-color:var(--xp2);}
.typing{display:flex;gap:4px;padding:3px 0;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--tx2);animation:bl 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
.na{position:fixed;bottom:20px;right:20px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.ni2{background:var(--bg2);border:1px solid var(--bd2);border-radius:12px;padding:12px 16px;font-size:12px;max-width:280px;animation:si2 .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);}
@keyframes si2{from{transform:translateX(80px);opacity:0}to{transform:translateX(0);opacity:1}}
.inp{width:100%;background:var(--bg3);border:1px solid var(--bd2);border-radius:9px;padding:9px 12px;color:var(--tx);font-family:Syne,sans-serif;font-size:13px;outline:none;}
.inp:focus{border-color:var(--xp2);}
.ingold{color:var(--gold);font-family:'DM Mono',monospace;font-size:15px;font-weight:600;}
.inxp{color:var(--xp);font-family:'DM Mono',monospace;font-size:15px;font-weight:600;}
select.inp{cursor:pointer;}
textarea.inp{resize:none;}
.lbl{font-size:10px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;display:block;margin-bottom:5px;}
.dbt{background:rgba(255,85,85,.07);border:1px solid rgba(255,85,85,.18);border-radius:11px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:12px;}
.pg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.po{background:var(--bg3);border:1px solid var(--bd);border-radius:11px;padding:14px;cursor:pointer;text-align:center;transition:all .15s;}
.po:hover{border-color:var(--red);}
.mdbtn{font-size:20px;margin-bottom:6px;}
.cbr{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cbt{flex:1;height:5px;border-radius:3px;background:var(--bg3);overflow:hidden;}
.cbf{height:100%;border-radius:3px;}
.chartb{display:flex;align-items:flex-end;gap:6px;}
.moodbtn{flex:1;text-align:center;font-size:22px;cursor:pointer;padding:7px;border-radius:9px;border:1px solid var(--bd);transition:all .15s;}
.moodbtn.sel{border-color:var(--xp);background:var(--bg3);}
.bosscard{background:linear-gradient(135deg,rgba(255,85,85,.07),rgba(155,109,255,.07));border:1px solid rgba(155,109,255,.2);border-radius:16px;padding:20px;margin-bottom:16px;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px;}
</style>
</head>
<body>

  </aside>
  <main class="main" id="main"></main>
</div>
<div class="na" id="na"></div>
<div class="mo h" id="mo"><div class="mb" id="mc"></div></div>

// HELPERS
// ═══════════════════════════════════════════════════════════
function lv() {
  var cur = LVS[0];
  for (var i = 0; i < LVS.length - 1; i++) {
    if (G.xp >= LVS[i+1].next) cur = LVS[i+1];
    else { cur = LVS[i]; break; }
  }
  return cur;
}
function lvProg() {
  var l = lv(), ni = Math.min(LVS.findIndex(function(x){return x.n===l.n;})+1, LVS.length-1);
  var nxt = LVS[ni];
  if (l.n === nxt.n) return 100;
  return Math.min(100, Math.round(((G.xp - l.next) / (nxt.next - l.next)) * 100));
}
function cc(c) { return {addictions:'ca',levelup:'cb',finance:'cc',religion:'cd',sante:'ce',social:'cf'}[c]||''; }
function ccolor(c) { return {addictions:'var(--red)',levelup:'var(--xp)',finance:'var(--gold)',religion:'var(--purple)',sante:'var(--red)',social:'var(--green)'}[c]||'var(--tx2)'; }
function cname(c) { return {addictions:'Addictions',levelup:'Level Up',finance:'Finance',religion:'Religion',sante:'Santé',social:'Social'}[c]||c; }
function dtag(d) { var m={easy:['Facile','te'],med:['Moyen','tm'],hard:['Difficile','th'],epic:['Épique','tp']}; var x=m[d]||['?','']; return '<span class="tag '+x[1]+'">'+x[0]+'</span>'; }
function tlabel(t) { return {daily:'Quotidien',weekly:'Hebdo',monthly:'Mensuel',streak3:'Streak 3j',streak5:'Streak 5j',milestone:'Milestone',unique:'Unique'}[t]||t; }
function pgold(d) { return {easy:10,med:25,hard:50,epic:100}[d]||10; }
function smult(cat) { var s=G.streaks[cat]; if(!s||!s.count) return 1; if(s.count>=30) return 3; if(s.count>=14) return 2; if(s.count>=7) return 1.5; if(s.count>=3) return 1.25; return 1; }
function unlocked(t) { if (!t.req) return true; var r = AT.find(function(x){return x.id===t.req;}); return r ? r.done : true; }
function reqName(t) { if (!t.req) return ''; var r = AT.find(function(x){return x.id===t.req;}); return r ? r.name : ''; }
function wkey() { var d=new Date(),j=new Date(d.getFullYear(),0,1),w=Math.ceil(((d-j)/86400000+j.getDay()+1)/7); return d.getFullYear()+'-W'+w; }

var SK = 'ilan_rpg_v4';
function save() {
  try {
    localStorage.setItem(SK, JSON.stringify({
      xp:G.xp, gold:G.gold, level:G.level,
      debtPaid:G.debtPaid, debtDone:G.debtDone,
      streaks:G.streaks, chat:G.chat.slice(-40),
      weekHist:G.weekHist, dayRev:G.dayRev,
      journal:G.journal, bosses:G.bosses,
      notif:G.notif, dayHist:G.dayHist, savedDate:new Date().toDateString(),
      tasks:AT.map(function(t){return {id:t.id,done:t.done,added:t.added};})
    }));
  } catch(e) {}
}
function load() {
  try {
    var raw = localStorage.getItem(SK);
    if (!raw) return;
    var d = JSON.parse(raw);
    G.xp=d.xp||0; G.gold=d.gold||0; G.level=d.level||1;
    G.debtPaid=d.debtPaid||false; G.debtDone=d.debtDone||0;
    G.streaks=d.streaks||{}; G.chat=d.chat||[];
    G.weekHist=d.weekHist||[]; G.dayRev=d.dayRev||[];
    G.journal=d.journal||[];
    G.bosses=d.bosses&&d.bosses.length ? d.bosses : defBosses();
    G.notif=d.notif||{morning:'08:00',evening:'20:00'};
    G.dayHist=d.dayHist||{};
    var isNew = d.savedDate !== new Date().toDateString();
    if (d.tasks && d.tasks.length) {
      AT = d.tasks.map(function(s) {
        var base = TASKS.find(function(t){return t.id===s.id;});
        if (!base) return null;
        return obj(base, {done: isNew ? false : (s.done||false), added: s.added||Date.now()});
      }).filter(Boolean);
    }
    if (isNew) setTimeout(function(){ notif('☀️ <b>Nouveau jour !</b> Tes tâches sont réinitialisées.','xp'); }, 600);
  } catch(e) { console.warn(e); }
}
window.addEventListener('beforeunload', save);
function obj(base, extra) { var r={}; for(var k in base) r[k]=base[k]; for(var k in extra) r[k]=extra[k]; return r; }

  if (!G.streaks[cat]) G.streaks[cat]={count:0,lastDate:null};

    h += '</div></div>';

  }

  h += '</div>';
  h += '<div class="ti">';
  h += '<div class="tn'+(t.done?' s':'')+'">'+t.name+'</div>';
  h += '<div class="tw">'+t.why+'</div>';

  h += '</div>';
  if (showFail && !t.done) h += '<button class="btn br bsm" onclick="failT(\''+t.id+'\')">Raté</button>';

}

function askDone(id) {
  var t = AT.find(function(x){return x.id===id;});
  if (!t || t.done) return;
  if (!unlocked(t)) { notif('🔒 Complète d\'abord : <b>'+reqName(t).substring(0,40)+'</b>','xp'); return; }
  var mult=smult(t.cat), xpG=Math.round(t.xp*mult);
  showM(
    '<div class="mt">✅ Confirmer</div>'+
    '<div class="ms">Tu as bien accompli :<br><b>'+t.name+'</b></div>'+
    '<div style="background:var(--bg3);border-radius:10px;padding:12px;display:flex;gap:12px;justify-content:center;margin-bottom:18px;">'+
    '<span class="tag tx" style="font-size:13px;padding:6px 12px;">+'+xpG+' XP'+(mult>1?' 🔥×'+mult:'')+'</span>'+
    '<span class="tag tg" style="font-size:13px;padding:6px 12px;">+'+t.gold+' ⬡</span>'+
    '</div>'+
    '<div class="mbtns">'+
    '<button class="btn bgh" style="flex:1" onclick="closeM()">Annuler</button>'+
    '<button class="btn bp" style="flex:1" onclick="doComplete(\''+id+'\')">Oui, accompli !</button>'+
    '</div>'
  );
}
function doComplete(id) {
  var t = AT.find(function(x){return x.id===id;});
  if (!t) return;
  closeM();
  var mult=smult(t.cat), xpG=Math.round(t.xp*mult), prevLv=lv().n;
  G.xp+=xpG; G.gold+=t.gold; t.done=true;
  updStreak(t.cat);
  // Daily snapshot
  var tod=new Date().toDateString();
  var dsnap=G.dayHist[tod]||{done:0,total:AT.length,xp:0,cats:{}};
  dsnap.done=AT.filter(function(x){return x.done;}).length;
  dsnap.total=AT.length;
  dsnap.xp=(dsnap.xp||0)+xpG;
  dsnap.cats[t.cat]=(dsnap.cats[t.cat]||0)+1;
  G.dayHist[tod]=dsnap;
  // Weekly snapshot
  var wk=wkey(), we=G.weekHist.find(function(w){return w.week===wk;});
  if (we) { we.xp=G.xp; we.gold=G.gold; we.done=Math.max(we.done||0, AT.filter(function(x){return x.done;}).length); }
  else G.weekHist.push({week:wk,xp:G.xp,gold:G.gold,done:1});
  if (G.weekHist.length>12) G.weekHist.shift();
  save();
  notif('✅ <b>'+t.name.substring(0,35)+'</b><br>+'+xpG+' XP'+(mult>1?' (×'+mult+')':'')+'  +'+t.gold+' Gold','xp');
  if (lv().n > prevLv) setTimeout(function(){notif('🎉 <b>NIVEAU '+lv().n+' !</b> '+lv().title,'level');},400);
  if (t.type==='unique') setTimeout(function(){showReplace(t);},700);
  draw();
}
function failT(id) {
  var t = AT.find(function(x){return x.id===id;});
  if (!t) return;
  var gl = pgold(t.diff);
  showM(
    '<div class="mt">⚡ Tâche ratée</div>'+
    '<div class="ms">Tu as raté :<br><b>'+t.name+'</b><br>Choisis ta punition :</div>'+
    '<div class="pg2">'+
    '<div class="po" onclick="applyP(\'task\',\''+id+'\')"><div class="mdbtn">💪</div><div style="font-size:12px;font-weight:700;">Tâche de rachat</div><div style="font-size:11px;color:var(--tx2);">Mission difficile maintenant</div></div>'+
    '<div class="po" onclick="applyP(\'gold\',\''+id+'\','+gl+')"><div class="mdbtn">💸</div><div style="font-size:12px;font-weight:700;">Perte de Gold</div><div style="font-size:11px;color:var(--tx2);">−'+gl+' Gold</div></div>'+
    '</div>'+
    '<button class="btn bgh bfw" onclick="closeM()">Annuler</button>'
  );
}
function applyP(type, id, gl) {
  if (type==='gold') { G.gold=Math.max(0,G.gold-(gl||10)); notif('💸 Punition : −'+(gl||10)+' Gold','gold'); }
  else notif('💪 Rachat : 30 pompes ou 15 min de méditation !','xp');
  var t=AT.find(function(x){return x.id===id;});
  if (t && G.streaks[t.cat]) G.streaks[t.cat].count=0;
  save(); closeM(); draw();
}
function showReplace(done) {
  var opts = TASKS.filter(function(t){return t.cat===done.cat&&t.id!==done.id;}).sort(function(){return Math.random()-.5;}).slice(0,3);
  var h = '<div class="mt">🔄 Tâche unique accomplie !</div><div class="ms">Choisis sa remplaçante :</div>';
  opts.forEach(function(t) {
    h += '<div class="mopt" onclick="replaceT(\''+done.id+'\',\''+t.id+'\')">';
    h += '<div class="moptn">'+t.name+'</div>';
    h += '<div style="display:flex;gap:6px;">'+dtag(t.diff)+'<span class="tag tx">+'+t.xp+'</span><span class="tag tg">+'+t.gold+'</span></div>';
    h += '</div>';
  });
  h += '<button class="btn bgh bfw" onclick="closeM()">Plus tard</button>';
  showM(h);
}
function replaceT(oldId, newId) {
  var idx=AT.findIndex(function(t){return t.id===oldId;}), base=TASKS.find(function(t){return t.id===newId;});
  if (idx>=0&&base) { AT[idx]=obj(base,{done:false,added:Date.now()}); notif('🆕 Nouvelle tâche ajoutée','xp'); }
  save(); closeM(); draw();
}

function pgDash() {
  var l=lv(), p=lvProg();
  var done=AT.filter(function(t){return t.done;}), pend=AT.filter(function(t){return !t.done;});
  // ── SMART PRIORITY SCORING ─────────────────────────────
  var now2 = new Date(), hour = now2.getHours();
  var catPriority = {addictions:10, levelup:9, religion:8, finance:7, sante:6, social:5};

  function taskScore(t) {
    if (!unlocked(t)) return -1;
    var score = 0;

    // 1. Catégorie prioritaire (Level Up et Addictions en premier)
    score += (catPriority[t.cat] || 5) * 10;

    // 2. Bonus si streak actif sur cette catégorie (ne pas le casser !)
    var s = G.streaks[t.cat];
    if (s && s.count >= 3) score += 30;
    if (s && s.count >= 7) score += 20; // bonus supplémentaire
    if (s && s.count >= 14) score += 20;

    // 3. Bonus si tâche en retard (plus c'est vieux, plus c'est urgent)
    var ageDays = Math.round((Date.now() - t.added) / 86400000);
    if (ageDays >= 1) score += 15;
    if (ageDays >= 3) score += 25;
    if (ageDays >= 7) score += 40;

    // 4. Heure de la journée — tâches contextuelles
    if (hour < 10) {
      // Matin : tephilines, se lever tôt, sport
      if (t.id === 'r1') score += 50; // tephilines
      if (t.id === 's6') score += 40; // se lever avant 8h
      if (t.cat === 'sante') score += 20;
    } else if (hour >= 10 && hour < 17) {
      // Journée : Level Up, finance
      if (t.cat === 'levelup') score += 30;
      if (t.cat === 'finance') score += 20;
    } else if (hour >= 17) {
      // Soir : addictions, social, bilan
      if (t.cat === 'addictions') score += 30;
      if (t.cat === 'social') score += 20;
      if (t.id === 's5') score += 30; // dormir avant minuit
    }

    // 5. Facile en premier si rien de fait encore
    if (done.length === 0) {
      if (t.diff === 'easy') score += 20;
      if (t.diff === 'med') score += 10;
    }

    // 6. Tâche épique remonte si streak multiplicateur actif
    var mult = smult(t.cat);
    if (mult >= 1.5 && t.diff === 'epic') score += 25;

    // 7. Malus si tâche déjà vue plusieurs fois sans être faite
    if (ageDays >= 5 && t.diff === 'easy') score += 15; // honte bonus

    return score;
  }

  // Toutes les tâches non accomplies + débloquées, triées par score
  var scoredTasks = pend
    .filter(function(t){ return unlocked(t); })
    .map(function(t){ return {task:t, score:taskScore(t)}; })
    .sort(function(a,b){ return b.score - a.score; });

  var daily = scoredTasks.slice(0,5).map(function(s){ return s.task; });
  // ────────────────────────────────────────────────────────
  var dp=Math.round((G.debtDone/G.debtAmt)*100);
  var h='<div class="ptitle">Bonjour, Ilan 👋</div><div class="psub">Niveau '+l.n+' — '+l.title+'</div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:16px;">';
  h+='<button class="btn bgh" style="flex:1;justify-content:center;" onclick="go(\'soir\')">🌙 Bilan du soir</button>';
  h+='<button class="btn bgh" style="flex:1;justify-content:center;" onclick="go(\'boss\')">⚔️ Boss du mois</button>';
  h+='<button class="btn bgh" style="flex:1;justify-content:center;" onclick="showAddT()">➕ Tâche</button>';
  h+='</div>';
  if (!G.debtPaid) {
    h+='<div class="dbt"><span style="font-size:16px;">💳</span><div style="flex:1"><div style="font-weight:600;margin-bottom:3px;">Dettes : '+G.debtDone+'₪ / '+G.debtAmt+'₪</div><div class="xbar"><div class="xfill" style="width:'+dp+'%;background:linear-gradient(90deg,var(--red),var(--orange))"></div></div></div><button class="btn bgh bsm" onclick="showDebt()">Mettre à jour</button></div>';
  } else {
    h+='<div style="background:rgba(61,204,122,.07);border:1px solid rgba(61,204,122,.2);border-radius:11px;padding:10px 14px;margin-bottom:16px;font-size:12px;color:var(--green);font-weight:600;">✅ Dettes remboursées — Boutique complète débloquée !</div>';
  }
  h+='<div class="g3" style="margin-bottom:18px;">';
  h+='<div class="csm" style="text-align:center"><div class="snum" style="color:var(--xp)">'+G.xp.toLocaleString()+'</div><div class="slbl">XP total</div><div class="xbar"><div class="xfill" style="width:'+p+'%"></div></div><div class="slbl" style="margin-top:3px">'+p+'% → Nv.'+(l.n+1)+'</div></div>';
  h+='<div class="csm" style="text-align:center"><div class="snum" style="color:var(--gold)">'+G.gold+'</div><div class="slbl">Gold</div><div style="font-size:10px;color:var(--tx3);margin-top:4px">Boutique dès 60</div></div>';
  h+='<div class="csm" style="text-align:center"><div class="snum" style="color:var(--green)">'+done.length+'/'+AT.length+'</div><div class="slbl">Tâches du jour</div><div class="xbar" style="margin-top:5px"><div class="xfill" style="width:'+Math.round((done.length/Math.max(AT.length,1))*100)+'%;background:linear-gradient(90deg,var(--green),rgba(61,204,122,.4))"></div></div></div>';
  h+='</div>';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;"><div class="stitle" style="margin:0">Tâches prioritaires</div><button class="btn bgh bsm" onclick="showAddT()">➕</button></div>';
  if (daily.length) { h+=daily.map(function(t){return tcard(t,false);}).join(''); }
  else h+='<div style="color:var(--tx2);font-size:13px;padding:14px 0;">🎉 Toutes les tâches quotidiennes sont complétées !</div>';
  if (done.length) {
    h+='<div class="stitle">Accompli aujourd\'hui ✅</div>';
    h+=done.map(function(t){return '<div class="tc '+cc(t.cat)+'" style="opacity:.4;"><div class="tck done"><svg width="11" height="11" viewBox="0 0 11 11"><path d="M1.5 5.5l3 3 5-5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg></div><div class="ti"><div class="tn s">'+t.name+'</div></div><span class="tag tx">+'+t.xp+'</span></div>';}).join('');
  }
  return h;
}

function pgCalendar() {
  var h = '<div class="ptitle">Calendrier</div><div class="psub">Ta progression jour par jour — style GitHub</div>';

  // Build 3 months of data
  var now = new Date();
  var months = [];
  for (var mi = 2; mi >= 0; mi--) {
    var d = new Date(now.getFullYear(), now.getMonth() - mi, 1);
    months.push({year: d.getFullYear(), month: d.getMonth()});
  }

  var monthNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var dayNames = ['L','M','M','J','V','S','D'];

  // Legend
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px;font-size:11px;color:var(--tx2);">';
  h += '<span>Moins</span>';
  h += '<div style="width:12px;height:12px;border-radius:3px;background:var(--bg3);border:1px solid var(--bd);"></div>';
  h += '<div style="width:12px;height:12px;border-radius:3px;background:#1a3a1a;"></div>';
  h += '<div style="width:12px;height:12px;border-radius:3px;background:#2d6a2d;"></div>';
  h += '<div style="width:12px;height:12px;border-radius:3px;background:#3dcc7a;opacity:.6;"></div>';
  h += '<div style="width:12px;height:12px;border-radius:3px;background:var(--green);"></div>';
  h += '<span>Plus</span></div>';

  // Stats summary
  var allDays = Object.values(G.dayHist);
  var totalDays = allDays.length;
  var perfectDays = allDays.filter(function(d){return d.total>0&&(d.done/d.total)>=0.8;}).length;
  var totalXP = allDays.reduce(function(a,d){return a+(d.xp||0);},0);
  var bestStreak = 0, curStreak = 0;
  // Calculate longest streak
  var sortedDates = Object.keys(G.dayHist).sort(function(a,b){return new Date(a)-new Date(b);});
  sortedDates.forEach(function(ds){
    var d = G.dayHist[ds];
    if (d.total>0 && (d.done/d.total)>=0.5) { curStreak++; bestStreak=Math.max(bestStreak,curStreak); }
    else curStreak=0;
  });

  h += '<div class="g3" style="margin-bottom:20px;">';
  h += '<div class="csm" style="text-align:center"><div class="snum" style="color:var(--green)">'+perfectDays+'</div><div class="slbl">Jours parfaits (80%+)</div></div>';
  h += '<div class="csm" style="text-align:center"><div class="snum" style="color:var(--orange)">'+bestStreak+'</div><div class="slbl">Meilleure série</div></div>';
  h += '<div class="csm" style="text-align:center"><div class="snum" style="color:var(--xp)">'+totalDays+'</div><div class="slbl">Jours joués</div></div>';
  h += '</div>';

  // Render each month
  months.forEach(function(m) {
    var firstDay = new Date(m.year, m.month, 1);
    var lastDay = new Date(m.year, m.month+1, 0);
    var startDow = (firstDay.getDay()+6)%7; // Monday=0

    h += '<div class="card" style="margin-bottom:14px;">';
    h += '<div style="font-weight:700;font-size:14px;margin-bottom:14px;color:var(--tx);">'+monthNames[m.month]+' '+m.year+'</div>';

    // Day headers
    h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;">';
    dayNames.forEach(function(dn){ h += '<div style="text-align:center;font-size:10px;color:var(--tx3);font-weight:600;">'+dn+'</div>'; });
    h += '</div>';

    // Day cells
    h += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;">';

    // Empty cells before first day
    for (var i=0; i<startDow; i++) h += '<div></div>';

    // Day cells
    for (var day=1; day<=lastDay.getDate(); day++) {
      var date = new Date(m.year, m.month, day);
      var dateStr = date.toDateString();
      var isToday = dateStr === new Date().toDateString();
      var isFuture = date > new Date();
      var snap = G.dayHist[dateStr];

      var color, pct=0, title='';
      if (isFuture) {
        color = 'transparent';
      } else if (!snap || snap.total===0) {
        color = 'var(--bg3)';
        title = day+' — Pas de données';
      } else {
        pct = Math.round((snap.done/snap.total)*100);
        title = day+' — '+snap.done+'/'+snap.total+' tâches ('+pct+'%) • +'+snap.xp+' XP';
        if (pct===0) color='var(--bg3)';
        else if (pct<25) color='#1a2e1a';
        else if (pct<50) color='#1f3d1f';
        else if (pct<75) color='#2d6a2d';
        else if (pct<100) color='rgba(61,204,122,.5)';
        else color='var(--green)';
      }

      var border = isToday ? '2px solid var(--xp)' : '1px solid rgba(255,255,255,.04)';
      var dayStyle = 'aspect-ratio:1;border-radius:4px;background:'+color+';border:'+border+';cursor:'+(snap&&!isFuture ? 'pointer' : 'default')+';transition:transform .1s;';
      h += '<div data-date="' + dateStr + '" style="' + dayStyle + '" class="cal-day">';
      if (isToday) h += '<div style="position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--xp);white-space:nowrap;">auj.</div>';
      h += '</div>';
    }
    h += '</div>';

    // Month summary
    var monthDays = Object.keys(G.dayHist).filter(function(ds){
      var d=new Date(ds); return d.getMonth()===m.month&&d.getFullYear()===m.year;
    });
    var monthDone = monthDays.filter(function(ds){
      var s=G.dayHist[ds]; return s&&s.total>0&&(s.done/s.total)>=0.5;
    }).length;
    var monthXP = monthDays.reduce(function(a,ds){return a+(G.dayHist[ds].xp||0);},0);
    if (monthDays.length) {
      h += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--bd);display:flex;gap:16px;font-size:11px;color:var(--tx2);">';
      h += '<span>✅ <b style="color:var(--tx)">'+monthDone+'</b> jours actifs</span>';
      h += '<span>⚡ <b style="color:var(--xp)">+'+monthXP+' XP</b> ce mois</span>';
      h += '<span>📅 <b style="color:var(--tx)">'+monthDays.length+'</b> jours joués</span>';
      h += '</div>';
    }
    h += '</div>';
  });

  return h;
}

function showDayDetail(dateStr) {

  var d = new Date(dateStr);
  var pct = snap.total>0 ? Math.round((snap.done/snap.total)*100) : 0;
  var dayNames2 = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  var monthNames2 = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
  var j = G.journal.find(function(e){return e.date===dateStr;})||{};
  var rev = G.dayRev.find(function(e){return e.date===dateStr;})||{};

  var color = pct>=100?'var(--green)':pct>=75?'rgba(61,204,122,.5)':pct>=50?'#2d6a2d':pct>=25?'#1f3d1f':'var(--tx3)';

  h += '<div style="flex:1;background:var(--bg3);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:800;color:var(--xp)">+'+snap.xp+'</div><div style="font-size:11px;color:var(--tx2);">XP gagnés</div></div>';
  h += '<div style="flex:1;background:var(--bg3);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:22px;font-weight:800;color:var(--tx)">'+snap.done+'/'+snap.total+'</div><div style="font-size:11px;color:var(--tx2);">Tâches</div></div>';

    h += '<span>Total : <b style="color:var(--green)">'+rev.total+'₪</b></span>';
    h += '</div>';
  }

  if (j.text) {
    h += '<div style="background:var(--bg3);border-radius:10px;padding:10px 12px;margin-bottom:16px;">';
    h += '<div style="font-size:11px;color:var(--tx2);margin-bottom:4px;">'+(j.mood||'🙂')+' Journal</div>';
    h += '<div style="font-size:12px;line-height:1.5;color:var(--tx);">'+j.text+'</div>';
    h += '</div>';
  }

  if (snap.cats && Object.keys(snap.cats).length) {
    h += '<div style="font-size:11px;color:var(--tx2);margin-bottom:8px;">Catégories actives :</div>';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;">';

      h += '<span class="tag" style="background:'+ccolor(e[0])+'22;color:'+ccolor(e[0])+';">'+cname(e[0])+' ('+e[1]+')</span>';
    });
    h += '</div>';
  }

  h += '<button class="btn bgh bfw" onclick="closeM()">Fermer</button>';
  showM(h);
}

function coachAnalyze() {
  var now = new Date(), today = now.toDateString();
  var done = AT.filter(function(t){return t.done;});
  var pend = AT.filter(function(t){return !t.done;});
  var overdue = AT.filter(function(t){return !t.done&&(Date.now()-t.added)>3*86400000;});
  var rate = AT.length>0 ? Math.round((done.length/AT.length)*100) : 0;
  var todayRev = G.dayRev.find(function(e){return e.date===today;})||{};
  var boss = G.bosses&&G.bosses.length ? G.bosses[G.bosses.length-1] : null;
  var bossLeft = boss ? Math.max(0,Math.round((new Date(boss.deadline)-now)/86400000)) : 0;
  var bestStreak = Object.entries(G.streaks).reduce(function(b,e){return e[1].count>b.count?{cat:e[0],count:e[1].count}:b;},{cat:null,count:0});
  var brokenStreaks = Object.entries(G.streaks).filter(function(e){
    var s=e[1]; if(!s.lastDate||!s.count) return false;
    return Math.round((now-new Date(s.lastDate))/86400000)>1;
  });
  var addDone = done.filter(function(t){return t.cat==='addictions';}).length;
  var luDone = done.filter(function(t){return t.cat==='levelup';}).length;
  var relDone = done.filter(function(t){return t.cat==='religion';}).length;
  var sportDone = done.filter(function(t){return t.cat==='sante';}).length;
  return {done:done,pend:pend,overdue:overdue,rate:rate,todayRev:todayRev,boss:boss,
    bossLeft:bossLeft,bestStreak:bestStreak,brokenStreaks:brokenStreaks,
    addDone:addDone,luDone:luDone,relDone:relDone,sportDone:sportDone,
    lvl:lv(),debtLeft:G.debtAmt-G.debtDone,now:now,today:today};
}

// ── INTENT DETECTION ──────────────────────────────────────
function detectIntent(txt) {
  var t = txt.toLowerCase();
  if(/(export|sauvegard|backup|telecharge|download|enregistr).*(sauvegard|progression|fichier|backup|jeu)/.test(t)||/(sauvegard|backup|export).*(export|telecharge|download|fichier)/.test(t)) return 'export_save';
  if(/(import|restaure|charge|recharge).*(sauvegard|progression|fichier|backup)/.test(t)) return 'import_save';
  if(/(ajoute|cree|creer|nouvelle tache|rajoute|nouvelle? t.che|add task|nouvel objectif)/.test(t)) return 'add_task';
  if(/(supprime|enleve|retire|efface|delete|remove).*(tache|task|objectif)/.test(t)) return 'delete_task';
  if(/(liste|montre|affiche|quelles? sont).*(taches?|objectifs?)/.test(t)) return 'list_tasks';
  if(/(j.ai fait|j.ai accompli|j.ai termine|valide|check).+/.test(t)) return 'mark_done';
  if(/(ajoute|cree|nouveau).*(boss|defi|challenge|mission du mois)/.test(t)) return 'add_boss';
  return null;
}

function handleIntent(txt) {
  var intent = detectIntent(txt);
  if(!intent) return null;

  if(intent==='export_save'){
    var data = localStorage.getItem('ilan_rpg_v4');
    if(!data){ return 'Aucune sauvegarde trouv\u00e9e dans ce navigateur.'; }
    var blob = new Blob([data], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ilan-rpg-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    return '\u2705 Sauvegarde t\u00e9l\u00e9charg\u00e9e ! Le fichier <b>ilan-rpg-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json</b> est dans tes t\u00e9l\u00e9chargements. Garde-le pr\u00e9cieusement.';
  }
  if(intent==='import_save'){
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try {
          var data = ev.target.result;
          JSON.parse(data); // validate
          localStorage.setItem('ilan_rpg_v4', data);
          addCoachM('\u2705 Sauvegarde import\u00e9e ! Recharge la page pour voir ta progression restaur\u00e9e.');
          save();
        } catch(err) {
          addCoachM('Fichier invalide. Assure-toi d\'utiliser un fichier export\u00e9 depuis ce jeu.');
        }
      };
      reader.readAsText(file);
    };
    inp.click();
    return 'Choisis ton fichier de sauvegarde (.json)...';
  }
  if(intent==='list_tasks'){
    var cats3=['addictions','levelup','finance','religion','sante','social'];
    var out='<b>Tes t\u00e2ches actives :</b><br><br>';
    cats3.forEach(function(c){
      var ct=AT.filter(function(t2){return t2.cat===c;});
      if(ct.length){out+='<b>'+cname(c)+'</b><br>';ct.forEach(function(t2,i){out+=(t2.done?'\u2705 ':'\u25a1 ')+(i+1)+'. '+t2.name+'<br>';});out+='<br>';}
    });
    return out+'Tu veux modifier, supprimer ou ajouter une t\u00e2che ?';
  }

  if(intent==='add_task'){
    resetCS(); coachState.mode='add_task'; coachState.step=1;
    return 'On va cr\u00e9er une nouvelle t\u00e2che ensemble.<br><b>Quel est le nom de la t\u00e2che ?</b>';
  }
  if(intent==='delete_task'){
    resetCS(); coachState.mode='delete_task'; coachState.step=1;
    var out2='<b>Quelle t\u00e2che tu veux supprimer ?</b><br><br>';
    AT.forEach(function(t2,i){out2+='<b>'+(i+1)+'</b>. '+t2.name+' ('+cname(t2.cat)+')<br>';});
    return out2+'<br>Donne-moi le num\u00e9ro ou le nom.';
  }
  if(intent==='add_boss'){
    resetCS(); coachState.mode='add_boss'; coachState.step=1;
    return 'On va cr\u00e9er un nouveau Boss du mois.<br><b>Quel est le d\u00e9fi ?</b>';
  }
  if(intent==='mark_done'){
    resetCS(); coachState.mode='mark_done'; coachState.step=1;
    var pnd2=AT.filter(function(x){return !x.done&&unlocked(x);});
    var out3='<b>Quelle t\u00e2che tu as accomplie ?</b><br><br>';
    pnd2.slice(0,10).forEach(function(t2,i){out3+='<b>'+(i+1)+'</b>. '+t2.name+'<br>';});
    return out3+'<br>Donne-moi le num\u00e9ro.';
  }
  return null;
}

function handleStep(txt) {
  if(!coachState.mode) return null;
  var t=txt.trim(), n=parseInt(t);
  var cats4=['addictions','levelup','finance','religion','sante','social'];
  var diffs=['easy','med','hard','epic'];
  var types=['daily','weekly','monthly','unique'];
  var diffXP={easy:20,med:40,hard:100,epic:300};
  var diffGold={easy:8,med:16,hard:40,epic:120};
  var diffNames=['Facile','Moyen','Difficile','\u00c9pique'];
  var typeNames=['Quotidien','Hebdomadaire','Mensuel','Unique'];

  // ADD TASK
  if(coachState.mode==='add_task'){
    if(coachState.step===1){
      coachState.data.name=t; coachState.step=2;
      return 'T\u00e2che : <b>"'+t+'"</b><br><br>Cat\u00e9gorie ?<br><b>1</b> \u2014 Addictions<br><b>2</b> \u2014 Level Up<br><b>3</b> \u2014 Finance<br><b>4</b> \u2014 Religion<br><b>5</b> \u2014 Sant\u00e9/Sport<br><b>6</b> \u2014 Social';
    }
    if(coachState.step===2){
      var ci2=n>=1&&n<=6?n-1:cats4.findIndex(function(c){return t.includes(c);});
      if(ci2<0) return TX.noCompris;
      coachState.data.cat=cats4[ci2]; coachState.step=3;
      return 'Cat\u00e9gorie : <b>'+cname(coachState.data.cat)+'</b><br><br>Difficult\u00e9 ?<br><b>1</b> \u2014 Facile (~20 XP)<br><b>2</b> \u2014 Moyen (~40 XP)<br><b>3</b> \u2014 Difficile (~100 XP)<br><b>4</b> \u2014 \u00c9pique (~300 XP)';
    }
    if(coachState.step===3){
      var di=n>=1&&n<=4?n-1:-1;
      if(di<0) return TX.stp14;
      coachState.data.diff=diffs[di]; coachState.data.xp=diffXP[diffs[di]]; coachState.data.gold=diffGold[diffs[di]];
      coachState.step=4;
      return 'Difficult\u00e9 : <b>'+diffNames[di]+'</b><br><br>Type ?<br><b>1</b> \u2014 Quotidien<br><b>2</b> \u2014 Hebdomadaire<br><b>3</b> \u2014 Mensuel<br><b>4</b> \u2014 Unique';
    }
    if(coachState.step===4){
      var ti=n>=1&&n<=4?n-1:-1;
      if(ti<0) return TX.stp14;
      coachState.data.type=types[ti]; coachState.step=5;
      return 'Type : <b>'+typeNames[ti]+'</b><br><br>Pourquoi cette t\u00e2che ? ('+TX.taskWhy+')';
    }
    if(coachState.step===5){
      coachState.data.why=t; coachState.step=6;
      var d=coachState.data;
      var di2=diffs.indexOf(d.diff);
      return 'T\u00e2che \u00e0 cr\u00e9er :<br><br>\ud83d\udccc <b>'+d.name+'</b><br>\ud83d\udcc2 '+cname(d.cat)+'<br>\u26a1 +'+d.xp+' XP<br>\u2b21 +'+d.gold+' Gold<br>\ud83d\udd01 '+typeNames[types.indexOf(d.type)]+'<br>\ud83d\udca1 '+d.why+'<br><br><b>"oui"</b> pour confirmer ou <b>"non"</b> pour annuler.';
    }
    if(coachState.step===6){
      if(/^(oui|yes|ok|confirme|valide|go|ouais)$/i.test(t)){
        var d2=coachState.data;
        var nt={id:'coach_'+Date.now(),cat:d2.cat,name:d2.name,why:d2.why||'T\u00e2che ajout\u00e9e par le Coach',diff:d2.diff,xp:d2.xp,gold:d2.gold,type:d2.type,req:null,done:false,added:Date.now(),custom:true};
        AT.push(nt); save(); resetCS();
        notif('\u2705 T\u00e2che cr\u00e9\u00e9e : <b>'+nt.name+'</b>','xp');
        return '\u2705 T\u00e2che <b>"'+nt.name+'"</b> ajout\u00e9e ! Elle appara\u00eet dans tes t\u00e2ches.<br><br>Tu veux autre chose ?';
      } else { resetCS(); return 'Annul\u00e9. Dis-moi ce que tu veux faire.'; }
    }
  }

  // DELETE TASK
  if(coachState.mode==='delete_task'){
    if(coachState.step===1){
      var tgt=n>=1&&n<=AT.length?AT[n-1]:AT.find(function(x){return x.name.toLowerCase().includes(t.toLowerCase());});
      if(!tgt) return TX.notFoundTask;
      coachState.data.task=tgt; coachState.step=2;
      return 'Supprimer : <b>"'+tgt.name+'"</b> ('+cname(tgt.cat)+')<br><br><b>"oui"</b> pour confirmer.';
    }
    if(coachState.step===2){
      if(/^(oui|yes|ok|confirme)$/i.test(t)){
        var td=coachState.data.task;
        AT=AT.filter(function(x){return x.id!==td.id;}); save(); resetCS();
        notif('\ud83d\uddd1\ufe0f Supprim\u00e9e : '+td.name,'xp');
        return '\u2705 T\u00e2che <b>"'+td.name+'"</b> supprim\u00e9e.';
      } else { resetCS(); return TX.cancelled; }
    }
  }

  // MARK DONE
  if(coachState.mode==='mark_done'){
    if(coachState.step===1){
      var pnd3=AT.filter(function(x){return !x.done&&unlocked(x);});
      var tgt2=n>=1&&n<=pnd3.length?pnd3[n-1]:pnd3.find(function(x){return x.name.toLowerCase().includes(t.toLowerCase());});
      if(!tgt2) return TX.notFound;
      coachState.data.task=tgt2; coachState.step=2;
      return 'Tu confirmes avoir accompli :<br><b>"'+tgt2.name+'"</b><br>+'+tgt2.xp+' XP et +'+tgt2.gold+' Gold.<br><br><b>"oui"</b> pour valider.';
    }
    if(coachState.step===2){
      if(/^(oui|yes|ok|confirme)$/i.test(t)){
        var td2=coachState.data.task; resetCS(); doComplete(td2.id); return null;
      } else { resetCS(); return TX.noValid; }
    }
  }

  // ADD BOSS
  if(coachState.mode==='add_boss'){
    if(coachState.step===1){coachState.data.title=t;coachState.step=2;return 'D\u00e9fi : <b>"'+t+'"</b><br><br>Objectif en combien d\u2019unit\u00e9s ? (ex: 3 clients, 10 posts...)';}
    if(coachState.step===2){coachState.data.target=n||3;coachState.step=3;return 'Objectif : <b>'+coachState.data.target+'</b><br><br>R\u00e9compense en XP si tu gagnes ? (d\u00e9faut: 1000)';}
    if(coachState.step===3){coachState.data.xp=n||1000;coachState.step=4;return 'XP victoire : <b>+'+coachState.data.xp+'</b><br><br>Et en Gold ? (d\u00e9faut: 400)';}
    if(coachState.step===4){
      coachState.data.gold=n||400; coachState.step=5;
      var db=coachState.data;
      return 'Boss :<br><br>\u2694\ufe0f <b>'+db.title+'</b><br>\ud83c\udfaf Objectif : '+db.target+' unit\u00e9s<br>\ud83c\udfc6 Victoire : +'+db.xp+' XP / +'+db.gold+' Gold<br>\ud83d\udcb8 \u00c9chec : \u2212'+Math.round(db.gold*.25)+' Gold<br><br><b>"oui"</b> pour confirmer.';
    }
    if(coachState.step===5){
      if(/^(oui|yes|ok|confirme)$/i.test(t)){
        var db2=coachState.data;
        var end=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).toDateString();
        G.bosses.push({id:'b_'+Date.now(),title:db2.title,desc:'',xp:db2.xp,gold:db2.gold,penalty:Math.round(db2.gold*.25),deadline:end,done:false,failed:false,progress:0,target:db2.target});
        save(); resetCS(); notif('\u2694\ufe0f Nouveau Boss cr\u00e9\u00e9 !','xp');
        return '\u2694\ufe0f Boss <b>"'+db2.title+'"</b> cr\u00e9\u00e9 !';
      } else { resetCS(); return TX.cancelledBoss; }
    }
  }
  return null;
}

  else{vb.style.cssText='background:rgba(216,90,48,.08);border:1px solid rgba(216,90,48,.25);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:12px';ss('wverd-lbl','Manque a gagner');ss('wverd-det','Il faut viser plus haut.');var vv2=wg('wverd-val');if(vv2){vv2.textContent=wfmt(Math.abs(sur));vv2.style.color='#D85A30';}var vl2=wg('wverd-lbl');if(vl2)vl2.style.color='#D85A30';}}
}
function wrenderList(type){
  var list=type==='charges'?wcharges:wdettes,elid=type==='charges'?'wcharges-list':'wdettes-list',el=wg(elid);
  if(!el)return;el.innerHTML='';
  list.forEach(function(item,i){
    var row=document.createElement('div');row.className='wedit';
    row.innerHTML='<span class="wedot" style="background:'+item.color+'"></span><input class="wenm" type="text" value="'+item.name+'"><input class="weamt'+(type==='dettes'?' wr':'')+'" type="number" value="'+item.amount+'"><span style="font-size:11px;color:var(--tx2);margin-left:2px">\u20aa</span><button class="btn br bsm" style="padding:3px 7px">\u00d7</button>';
    var nm=row.querySelector('.wenm'),amt=row.querySelector('.weamt'),del=row.querySelector('button');
    nm.addEventListener('input',function(){item.name=this.value;wrecalc();});
    amt.addEventListener('input',function(){item.amount=parseFloat(this.value)||0;wrecalc();});
    (function(idx){del.addEventListener('click',function(){if(type==='charges')wcharges.splice(idx,1);else wdettes.splice(idx,1);wrecalc();});})(i);
    el.appendChild(row);
  });
}
function waddItem(type){var color=WCOLORS[wci%WCOLORS.length];wci++;if(type==='charges')wcharges.push({name:'Nouvelle charge',amount:0,color:color});else wdettes.push({name:'Nouvelle dette',amount:0,color:color});wrecalc();}
function wswitchTab(name,btn){document.querySelectorAll('.wtc').forEach(function(t){t.classList.remove('wa');});document.querySelectorAll('.wtab').forEach(function(t){t.classList.remove('wa');});var tc=wg('wtab-'+name);if(tc)tc.classList.add('wa');if(btn)btn.classList.add('wa');}
